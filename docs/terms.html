            right: 1rem;

            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 100px;

            background: transparent;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            font-family: inherit;
            color: var(--text-secondary);
            transition: all 0.2s;

        .lang-btn.active {
            background: var(--primary);
            color: white;
        }

            top: 0;
            background: var(--veil);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 900;

            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;

            font-weight: 700;
            font-size: 1.05rem;

            text-decoration: none;
            font-weight: 500;
            font-size: 0.9375rem;
        }

            text-align: center;
            background: linear-gradient(180deg, var(--card-bg) 0%, var(--paper-1) 100%);

            font-weight: 700;
            margin-bottom: 0.75rem;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            color: var(--text-secondary);
            font-size: 0.9375rem;

            margin: 2rem auto 0;
            padding: 0 2rem;

            border: 1px solid #A5D6A7;
            border-radius: 14px;
            padding: 1.25rem 1.5rem;

            align-items: center;
            gap: 1rem;

            color: #1B5E20;

            background: #E8F1FF;

            padding: 0.125rem 0.625rem;
            border-radius: 100px;
            font-size: 0.8125rem;
            font-weight: 600;
            margin-right: 0.5rem;

        table {

            margin: 1rem 0;
            font-size: 0.9375rem;

        th, td {

            text-decoration: none;

        /// 브라우저 언어 태그·저장값·?lang= 을 이 페이지가 아는 언어로 옮긴다.
        /// 모르는 값이면 빈 문자열(=호출한 쪽이 기본값을 정한다).
        /// ⚠️ 대만·홍콩·마카오는 번체다. zh 로만 보고 간체를 주면 남의 글자를 보게 된다.
        function normalizeLang(tag) {
            var t = (tag || '').toLowerCase().replace('_', '-');
            if (!t) return '';
            if (t.indexOf('ko') === 0) return 'ko';
            if (t.indexOf('en') === 0) return 'en';
            if (t.indexOf('zh') === 0) {
                if (t.indexOf('hant') >= 0 || t.indexOf('-tw') >= 0 ||
                    t.indexOf('-hk') >= 0 || t.indexOf('-mo') >= 0) return 'zh-Hant';
                return 'zh-Hans';   // zh · zh-CN · zh-SG, 그리고 갈리기 전에 저장된 'zh'
            }
            return '';
        }

        function setLanguage(lang) {
            localStorage.setItem('clipkb-lang', lang);
            applyLanguage(lang);
        }

        function applyLanguage(lang) {
            const t = translations[lang];
            if (!t) return;
            document.documentElement.lang = lang;
            document.title = t.pageTitle;

            document.querySelectorAll('[data-i18n]').forEach(function(el) {
                var key = el.getAttribute('data-i18n');
                if (t[key] !== undefined) el.textContent = t[key];
            });
            document.querySelectorAll('[data-i18n-html]').forEach(function(el) {
                var key = el.getAttribute('data-i18n-html');
                if (t[key] !== undefined) el.innerHTML = t[key];
            });
            document.querySelectorAll('.lang-btn').forEach(function(btn) {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
            });
        }

        (function() {
            // ?lang= 으로 들어오면 그 언어로 연다 (index.html 과 같은 규칙).
            var asked = normalizeLang(new URLSearchParams(window.location.search).get('lang') || '');
            if (asked) {
                setLanguage(asked);
                return;
            }
            // 예전에 'zh' 로 저장된 사람은 간체로 옮겨 준다(간체·번체가 갈리기 전 값).
            var saved = normalizeLang(localStorage.getItem('clipkb-lang') || '');
            if (saved) {
                applyLanguage(saved);
                return;
            }
            applyLanguage(normalizeLang(navigator.language || navigator.userLanguage || '') || 'en');
        })();
    </script>
