name: CI

# 로컬에서만 돌던 게이트(scripts/predeploy.sh)를 PR/푸시마다 자동으로 돌린다.
# 테스트 396개와 다국어 검사가 이미 있는데 실행이 사람 손에 달려 있던 문제를 없앤다.
#
# 게이트 로직은 predeploy.sh 한 곳에만 둔다 — 여기서 명령을 복제하면
# 로컬과 CI가 갈라진다.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  # 같은 브랜치에 연속 푸시하면 이전 실행은 취소 — 러너 시간 절약
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 빌드 · 테스트 · 다국어 검사
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Xcode 버전 확인
        run: xcodebuild -version

      # LeeoKit(공개 SPM 패키지)을 매번 새로 받지 않도록 캐시.
      - name: SPM 캐시
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: 시뮬레이터 준비
        run: xcrun simctl list devices available | grep iPhone | head -5

      # 다국어 검사 + 전체 테스트. 시뮬레이터 선택도 스크립트가 한다.
      - name: 게이트 실행 (predeploy.sh)
        run: sh scripts/predeploy.sh

  lint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10
    # ⚠️ 의도적으로 non-blocking으로 시작한다.
    #    현재 프로덕션 위반 13건(강제 언랩 11 · 파일 길이 2)이 남아 있어서,
    #    지금 blocking으로 걸면 모든 PR이 빨간불이 되고 결국 무시하게 된다.
    #    위반을 0으로 만든 뒤 이 줄을 지워 blocking으로 전환할 것.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: SwiftLint 설치
        run: brew install swiftlint

      - name: SwiftLint 실행
        run: swiftlint --strict
