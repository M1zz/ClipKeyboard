                s10L3: "<strong>Apple standard EULA</strong>: <a href=\"https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\" target=\"_blank\">read the full text</a>",
                footerHome: "Home",
                footerPrivacy: "Privacy Policy",
                footerContact: "Contact",
            }
        };

        function setLanguage(lang) {
            localStorage.setItem('clipkb-lang', lang);
            applyLanguage(lang);
        }

        function applyLanguage(lang) {
            const t = translations[lang];
            if (!t) return;
            document.documentElement.lang = lang;
            document.title = t.pageTitle;

            document.querySelectorAll('[data-i18n]').forEach(function(el) {
                var key = el.getAttribute('data-i18n');
                if (t[key] !== undefined) el.textContent = t[key];
            });
            document.querySelectorAll('[data-i18n-html]').forEach(function(el) {
                var key = el.getAttribute('data-i18n-html');
                if (t[key] !== undefined) el.innerHTML = t[key];
            });
            document.querySelectorAll('.lang-btn').forEach(function(btn) {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
            });
        }

        (function() {
            // ?lang=en / ?lang=ko 로 들어오면 그 언어로 연다 (index.html 과 같은 규칙).
            var requested = (new URLSearchParams(window.location.search).get('lang') || '').toLowerCase();
            if (requested === 'en' || requested === 'ko') {
                setLanguage(requested);
                return;
            }
            var saved = localStorage.getItem('clipkb-lang');
            if (saved) {
                applyLanguage(saved);
            } else {
                var browserLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
                var lang = browserLang.startsWith('ko') ? 'ko' : 'en';
                applyLanguage(lang);
            }
        })();
    </script>
</body>
</html>
